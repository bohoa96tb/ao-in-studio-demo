name: Build and QA
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          node scripts/serve.mjs &
          export CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          TEST_URL=http://127.0.0.1:5264 npm run test:browser
          TEST_URL=http://127.0.0.1:5264 node tests/interaction.mjs
          TEST_URL=http://127.0.0.1:5264 node tests/p0.mjs
          TEST_URL=http://127.0.0.1:5264 node tests/p1.mjs
          TEST_URL=http://127.0.0.1:5264 node tests/p3.mjs
          TEST_URL=http://127.0.0.1:5264 node tests/p31.mjs
          TEST_URL=http://127.0.0.1:5264 node tests/p36.mjs
          TEST_URL=http://127.0.0.1:5264 node tests/p4.mjs
          TEST_URL=http://127.0.0.1:5264 node tests/ai-studio.mjs
          TEST_URL=http://127.0.0.1:5264 node tests/ai-studio-p2.mjs
          TEST_URL=http://127.0.0.1:5264 node tests/ai-studio-p3.mjs
          TEST_URL=http://127.0.0.1:5264 node tests/ai-studio-p4.mjs
          TEST_URL=http://127.0.0.1:5264 node tests/ai-studio-tpl1.mjs
          TEST_URL=http://127.0.0.1:5264 node scripts/performance.mjs
          git fetch origin 434ce99dd76b210b77738d308b255caf4876d177
          git worktree add --detach /tmp/ao-in-p0-baseline 434ce99dd76b210b77738d308b255caf4876d177
          PORT=5266 node /tmp/ao-in-p0-baseline/scripts/serve.mjs &
          node tests/baseline-screenshots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results
          path: qa-results
