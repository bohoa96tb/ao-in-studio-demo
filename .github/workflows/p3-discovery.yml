name: P3 Inventory Scan + Source Discovery

# Stages A+B of docs/P3_AUTOMATION.md: weekly + manual.
# A (Inventory Scan) summarises internal data only — it does not search
# the internet. B (Source Discovery) queries the official Pexels API only
# when the PEXELS_API_KEY secret exists, and emits unverified CANDIDATE
# rows for human review. Neither stage downloads photos, approves assets,
# buys anything, or merges.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/discovery/scan.mjs --write
      - name: Source Discovery (stage B, key-gated)
        run: node scripts/discovery/search-pexels.mjs
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-discovery-report
          path: |
            qa-results/p3-discovery-report.md
            qa-results/p3-source-discovery.md
            qa-results/p3-source-candidates.json
